const P1_KEYS = { left:'A'.charCodeAt(0), right:'D'.charCodeAt(0), jump:'W'.charCodeAt(0),
                  atk:70, s1:81, s2:69, s3:82 };
// 方向键这里必须用键盘码数值（LEFT=37 / UP=38 / RIGHT=39），

function initSelectScreen(){
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  const ids = Object.keys(CHARACTERS);
  ids.forEach(id => {
    const c = CHARACTERS[id];
    const card = document.createElement('div');
    card.className = 'char-card';
    card.style.setProperty('--card-color', c.color);
    card.style.setProperty('--card-shadow', c.color+'44');
    card.dataset.id = id;
    let skillsHtml = c.skills.map((s,i)=>`
      <div class="skill-item">
        <div class="skill-key"><span class="kp1">${P1_SKILL_KEYS[i]}</span><span class="kp2">${P2_SKILL_KEYS[i]}</span></div>
        <div><b>${s.name}</b>${s.cost>0?`(${s.cost}犇气)`:''}：${s.desc}</div>
      </div>`).join('');
    card.innerHTML = `
      <div class="char-header">
        <div class="char-avatar" style="--card-color:${c.color};--card-shadow:${c.color}66">${c.emoji}</div>
        <div>
          <div class="char-name" style="color:${c.color}">${c.name}</div>
          <div class="char-tag" style="color:${c.color}">${c.tag}</div>
        </div>
      </div>
      <div class="char-stats">
        <div class="stat"><div class="stat-val" style="--card-color:${c.color}">${c.hp}</div><div class="stat-label">血量</div></div>
        <div class="stat"><div class="stat-val" style="--card-color:${c.color}">${c.atk}</div><div class="stat-label">普攻</div></div>
        <div class="stat"><div class="stat-val" style="--card-color:${c.color}">${c.bq}</div><div class="stat-label">犇气</div></div>
        <div class="stat"><div class="stat-val" style="--card-color:${c.color}">${Math.round(c.spd*50/4.2*10)/10}</div><div class="stat-label">移速</div></div>
      </div>
      <div class="char-skills">${skillsHtml}</div>
    `;
    card.addEventListener('click', ()=>pickCharacter(id));
    grid.appendChild(card);
  });
  updatePickHint();
}

function pickCharacter(id){
  if(pickingPlayer === 1){
    p1Char = id;
    pickingPlayer = 2;
  } else {
    p2Char = id;
    pickingPlayer = 1;
  }
  updateCards();
  updatePickHint();
  var btn = document.getElementById('startBtn');
  if(p1Char && p2Char){
    btn.classList.add('active');
    // 直接写 style，绕过 CSS 类可能没生效的问题
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
    btn.style.cursor = 'pointer';
  }
}

function updateCards(){
  document.querySelectorAll('.char-card').forEach(card=>{
    card.classList.remove('selected-p1','selected-p2','disabled');
    const badge = card.querySelector('.card-badge');
    if(badge) badge.remove();
    if(card.dataset.id === p1Char){
      card.classList.add('selected-p1');
      const b = document.createElement('div');
      b.className = 'card-badge badge-p1'; b.textContent = 'P1';
      card.appendChild(b);
    }
    if(card.dataset.id === p2Char){
      card.classList.add('selected-p2');
      const b = document.createElement('div');
      b.className = 'card-badge badge-p2'; b.textContent = 'P2';
      card.appendChild(b);
    }
    // 同角色可选：不再禁用已被对方选择的卡片
  });
}

function updatePickHint(){
  const v1 = document.getElementById('vsP1'), v2 = document.getElementById('vsP2');
  v1.textContent = p1Char ? CHARACTERS[p1Char].emoji+' '+CHARACTERS[p1Char].name : 'P1 待选择';
  v2.textContent = p2Char ? CHARACTERS[p2Char].emoji+' '+CHARACTERS[p2Char].name : 'P2 待选择';
  v1.classList.toggle('ready', !!p1Char); v2.classList.toggle('ready', !!p2Char);
  const h = document.getElementById('pickHint');
  if(pickingPlayer===1){
    h.textContent = p1Char ? '请玩家1重新选择角色' : '🔴 请玩家1（红色方）选择角色';
    h.style.borderColor = '#FF3B4E';
    h.style.color = '#FF3B4E';
    h.style.background = 'rgba(255,59,78,0.08)';
  } else {
    h.textContent = p2Char ? '请玩家2重新选择角色' : '🔵 请玩家2（蓝色方）选择角色';
    h.style.borderColor = '#3D6BFF';
    h.style.color = '#6688FF';
    h.style.background = 'rgba(61,107,255,0.08)';
  }
}

// ==================== 玩家类 ====================
class Fighter {
  constructor(x, y, charId, isP1){
    const c = CHARACTERS[charId];
    this.charId = charId;
    this.isP1 = isP1;
    this.x = x; this.y = y;
    this.w = 40; this.h = 72;
    this.vx = 0; this.vy = 0;
    this.color = c.color;
    this.teamColor = isP1 ? '#FF3B4E' : '#3D6BFF';
    this.teamGlow = isP1 ? [255,59,78] : [61,107,255];
    this.name = c.name;
    this.maxHp = c.hp; this.hp = c.hp;
    this.atk = c.atk;
    this.maxBq = c.bq; this.bq = c.bq;
    this.spd = c.spd;
    this.onGround = false;
    this.facing = isP1 ? 1 : -1;
    this.attackCooldown = 0;
    this.invincible = 0;
    this.stunned = 0;
    this.slowed = 0;
    this.slowAmount = 0;
    this.animFrame = 0;
    this.walkCycle = 0;
    this.attackAnim = 0;
    this.hurtFlash = 0;
    this.chargingRP = false;
    this.immortal = false;
    this.immortalTime = 0;
    this.teleportInvuln = 0;
    this.stolenSkills = [];
    this.copiedSkill = null;
    this.armAngle = 0;
    this.legAngle = 0;
  }

  get effectiveSpd(){
    let s = this.spd;
    if(this.slowed > 0) s *= (1 - this.slowAmount);
    return s;
  }

  update(opponent){
    if(this.hp <= 0) return;
    if(this.attackCooldown > 0) this.attackCooldown--;
    if(this.invincible > 0) this.invincible--;
    if(this.stunned > 0){ this.stunned--; this.vx *= 0.8; }
    if(this.slowed > 0) this.slowed--;
    if(this.hurtFlash > 0) this.hurtFlash--;
    if(this.attackAnim > 0) this.attackAnim--;
    if(this.teleportInvuln > 0) this.teleportInvuln--;

    if(this.charId === 'rpmaniac'){
      if(this.chargingRP){
        this.vx = 0;
        this.bq = Math.min(this.maxBq, this.bq + 5/60); // 每秒 +5 犇气
        if(frameCount % 10 === 0){
          spawnParticles(this.x, this.y - this.h/2, this.color, 2, 1);
        }
      }
      if(this.immortal){
        this.bq -= 10/60;
        this.vx = 0;            // 做题期间锁死水平移动
        this.vy = 0;            // 锁死垂直速度（防止重力下落中继续飘）
        this.onGround = true;   // 做题时双脚站稳
        if(this.bq <= 0){ this.immortal = false; this.bq = 0; }
        if(frameCount % 6 === 0){
          spawnParticles(this.x + random(-15,15), this.y - random(0,this.h), '#00FFFF', 1, 0.5);
        }
      }
    }

    // 做题（immortal）时完全不能动、不能跳，和 chargingRP 一并排除
    if(this.stunned <= 0 && !this.chargingRP && !this.immortal){
      const mi = this.isP1 ? mInput.p1 : mInput.p2;
      const left = (this.isP1 ? keys[P1_KEYS.left] : keys[P2_KEYS.left]) || mi.left;
      const right = (this.isP1 ? keys[P1_KEYS.right] : keys[P2_KEYS.right]) || mi.right;
      let jump = this.isP1 ? keyPressedOnce[P1_KEYS.jump] : keyPressedOnce[P2_KEYS.jump];
      if(!jump && mi.jump) jump = true;
      mi.jump = false;

      if(left){ this.vx = -this.effectiveSpd; this.facing = -1; }
      else if(right){ this.vx = this.effectiveSpd; this.facing = 1; }
      else this.vx *= 0.75;

      if(jump && this.onGround){
        this.vy = -11.5;
        this.onGround = false;
        spawnParticles(this.x, this.y, this.color, 5, 1.5);
      }
    }

    if(!this.immortal){
      this.vy += 0.55;
      if(this.vy > 15) this.vy = 15;
    }

    this.x += this.vx;
    this.handleCollisionX();
    this.x += this.vy > 0 ? 0 : 0;
    this.y += this.vy;
    this.onGround = false;
    this.handleCollisionY();

    if(this.x < this.w/2) this.x = this.w/2;
    if(this.x > width - this.w/2) this.x = width - this.w/2;
    if(this.y > height + 100){
      this.takeDamage(30, this.x, this.y, '#FF0044');
      this.x = this.isP1 ? 150 : width - 150;
      this.y = height - 200;
      this.vx = 0; this.vy = 0;
      this.invincible = 60;
    }

    if(Math.abs(this.vx) > 0.5 && this.onGround){
      this.walkCycle += 0.25;
    } else {
      this.walkCycle *= 0.8;
    }

    if(frameCount % 30 === 0 && this.bq < this.maxBq) this.bq = Math.min(this.maxBq, this.bq + 1);

    this.animFrame++;
  }

  handleCollisionX(){
    for(let p of platforms){
      if(this.x + this.w/2 > p.x && this.x - this.w/2 < p.x + p.w){
        if(this.y - this.h + 2 > p.y - 2 && this.y < p.y + p.h + 2){
          if(this.vx > 0){ this.x = p.x - this.w/2; this.vx = 0; }
          else if(this.vx < 0){ this.x = p.x + p.w + this.w/2; this.vx = 0; }
        }
      }
    }
  }

  handleCollisionY(){
    for(let p of platforms){
      if(this.x + this.w/2 > p.x && this.x - this.w/2 < p.x + p.w){
        if(this.vy >= 0 && this.y >= p.y && this.y - this.vy <= p.y + 2){
          this.y = p.y; this.vy = 0; this.onGround = true;
        } else if(this.vy < 0 && this.y - this.h <= p.y + p.h && this.y - this.h - this.vy >= p.y + p.h - 2){
          this.y = p.y + p.h + this.h; this.vy = 0;
        }
      }
    }
  }

  takeDamage(dmg, fromX, fromY, dmgColor){
    if(this.invincible > 0 || this.hp <= 0) return false;
    if(this.immortal){
      floatTexts.push({x:this.x, y:this.y-this.h-10, text:'免疫!', color:'#00FFFF', life:40, vy:-1.5});
      spawnParticles(this.x, this.y-this.h/2, '#00FFFF', 8, 2);
      return false;
    }
    if(this.teleportInvuln > 0){
      floatTexts.push({x:this.x, y:this.y-this.h-10, text:'闪避!', color:this.color, life:40, vy:-1.5});
      spawnParticles(this.x, this.y-this.h/2, this.color, 8, 2);
      return false;
    }
    if(this.charId === 'speculator' && this.bq >= 100){
      this.bq -= 100;
      floatTexts.push({x:this.x, y:this.y-this.h-10, text:'贿赂!', color:'#FFD700', life:50, vy:-1.5});
      spawnParticles(this.x, this.y-this.h/2, '#FFD700', 15, 3);
      screenShake = 5;
      return false;
    }
    const realDmg = Math.min(dmg, this.hp);
    const foe = this === p1 ? p2 : p1; if(foe) foe.dmgDealt = (foe.dmgDealt||0) + realDmg;
    this.hp -= dmg;
    hitStop = Math.max(hitStop, dmg >= 50 ? 8 : 3);
    this.hurtFlash = 12;
    this.invincible = 20;
    const dir = this.x > fromX ? 1 : -1;
    this.vx = dir * 5;
    this.vy = -3;
    floatTexts.push({x:this.x+random(-10,10), y:this.y-this.h-5-random(0,10), text:'-'+Math.round(dmg), color:dmgColor||'#FF4444', life:50, vy:-2});
    spawnParticles(this.x, this.y-this.h/2, dmgColor||'#FF4444', 10, 3);
    screenShake = Math.max(screenShake, 6);
    if(this.hp <= 0){ this.hp = 0; }
    return true;
  }

  attack(opponent){
    if(this.attackCooldown > 0 || this.stunned > 0 || this.chargingRP || this.immortal) return;
    this.attackCooldown = 25;
    this.attackAnim = 15;
    const reach = 52;
    const ax = this.x + this.facing * 34;
    slashEffects.push({
      x: ax, y: this.y - this.h/2,
      angle: this.facing > 0 ? 0 : PI,
      color: this.color, life: 12, maxLife: 12,
      range: reach
    });
    const dist = abs(opponent.x - ax);
    const dy = abs((opponent.y - opponent.h/2) - (this.y - this.h/2));
    if(dist < reach && dy < 50){
      if((this.facing > 0 && opponent.x > this.x - 5) || (this.facing < 0 && opponent.x < this.x + 5)){
        opponent.takeDamage(this.atk, this.x, this.y, this.color);
      }
    }
    spawnParticles(ax, this.y - this.h/2, this.color, 5, 2);
  }

  useSkill(idx, opponent){
    if(this.stunned > 0) return;
    if(this.immortal && !(this.charId === 'rpmaniac' && idx === 2)) return; // 做题期间只能按O取消
    switch(this.charId){
      case 'speculator': this.speculatorSkill(idx, opponent); break;
      case 'rpmaniac': this.rpSkill(idx, opponent); break;
      case 'dismantler': this.dismantlerSkill(idx, opponent); break;
      case 'corrector': this.correctorSkill(idx, opponent); break;
    }
  }

  speculatorSkill(idx, opponent){
    const dist = abs(opponent.x - this.x);
    if(idx === 0){
      if(this.bq < 50){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      if(dist > 60){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'太远了',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 50;
      const oppSkills = CHARACTERS[opponent.charId].skills;
      if(oppSkills.length > 0 && this.stolenSkills.length < 3){
        const sk = oppSkills[Math.floor(Math.random()*Math.min(3,oppSkills.length))];
        this.stolenSkills.push(sk);
        floatTexts.push({x:this.x,y:this.y-this.h-20,text:'偷到「'+sk.name+'」',color:'#C77DFF',life:60,vy:-1.5});
        for(let i=0;i<20;i++) spawnParticles(this.x, this.y-this.h/2, '#C77DFF', 1, 3);
        screenShake = 8;
      }
    } else if(idx === 1){
      if(this.bq < 100){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 100;
      this.invincible = 60;
      floatTexts.push({x:this.x,y:this.y-this.h-10,text:'贿赂防御!',color:'#FFD700',life:50,vy:-1.5});
      for(let i=0;i<20;i++) spawnParticles(this.x, this.y-this.h/2, '#FFD700', 1, 2.5);
    } else if(idx === 2){
      if(this.bq < 50){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 50;
      projectiles.push({
        x: this.x + this.facing*20, y: this.y - this.h/2,
        vx: this.facing * 7, vy: 0,
        dmg: 0, color: this.color, owner: this, type: 'copy', life: 90, r: 12, trail: []
      });
      spawnParticles(this.x+this.facing*20, this.y-this.h/2, this.color, 8, 2);
    }
  }

  rpSkill(idx, opponent){
    if(this.immortal && idx !== 2) return; // 做题期间只能再按O取消，不能放其他技能
    if(idx === 0){
      if(this.immortal) return; // 做题中不能切刷RP
      this.chargingRP = !this.chargingRP;
      if(this.chargingRP){ this.vx=0; this.vy=0; floatTexts.push({x:this.x,y:this.y-this.h-10,text:'刷RP中...',color:this.color,life:40,vy:-1.5}); }
    } else if(idx === 1){
      if(this.bq < 2){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      if(this.chargingRP) this.chargingRP = false;
      const cost = Math.min(this.bq, 40);
      const dmg = cost / 2;
      this.bq -= cost;
      projectiles.push({
        x: this.x + this.facing*20, y: this.y - this.h/2,
        vx: this.facing * 9, vy: 0,
        dmg: dmg, color: '#0088FF', owner: this, type: 'energy', life: 80, r: 8+dmg/8, trail: []
      });
      spawnParticles(this.x+this.facing*20, this.y-this.h/2, '#0088FF', 10, 2);
      screenShake = 3;
    } else if(idx === 2){
      if(this.bq < 10 && !this.immortal){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.immortal = !this.immortal;
      if(this.immortal){ this.chargingRP = false; this.vx=0; this.vy=0; this.onGround=true; floatTexts.push({x:this.x,y:this.y-this.h-10,text:'做题无敌!',color:'#00FFFF',life:50,vy:-1.5}); }
      else { floatTexts.push({x:this.x,y:this.y-this.h-10,text:'答题结束',color:'#00FFFF',life:40,vy:-1.5}); }
    } else if(idx === 3){
      if(this.bq < 50){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 50;
      const heal = 30;
      this.hp = Math.min(this.maxHp, this.hp + heal);
      floatTexts.push({x:this.x,y:this.y-this.h-10,text:'+'+heal,color:'#00FF88',life:50,vy:-1.5});
      for(let i=0;i<15;i++) spawnParticles(this.x, this.y-this.h/2+random(-20,0), '#00FF88', 1, 2);
    }
  }

  dismantlerSkill(idx, opponent){
    const dist = abs(opponent.x - this.x);
    const dy = abs((opponent.y - opponent.h/2) - (this.y - this.h/2));
    if(idx === 0){
      if(this.bq < 75){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 75;
      shockwaves.push({
        x: this.x, y: this.y - this.h/2,
        r: 10, maxR: 250, color: '#5F9FD6', life: 40, owner: this,
        dmg: 50, hit: new Set()
      });
      screenShake = 10;
      for(let i=0;i<25;i++) spawnParticles(this.x, this.y-this.h/2, '#5F9FD6', 1, 4);
    } else if(idx === 1){
      if(this.bq < 50){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      if(dist > 60 || dy > 50){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'太远了',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 50;
      opponent.takeDamage(20, this.x, this.y, this.color);
      opponent.slowed = 300;
      opponent.slowAmount = 0.25;
      floatTexts.push({x:opponent.x,y:opponent.y-opponent.h-20,text:'减速!',color:'#5F9FD6',life:60,vy:-1.5});
      slashEffects.push({x:opponent.x,y:opponent.y-opponent.h/2,angle:0,color:'#5F9FD6',life:15,maxLife:15,range:50});
      screenShake = 6;
      for(let i=0;i<12;i++) spawnParticles(opponent.x, opponent.y-opponent.h/2, '#5F9FD6', 1, 3);
    } else if(idx === 2){
      if(this.bq < 175){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      if(dist > 65 || dy > 55){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'太远了',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 175;
      shockwaves.push({
        x: (this.x+opponent.x)/2, y: opponent.y - opponent.h/2,
        r: 5, maxR: 100, color: '#FF3333', life: 30, owner: this,
        dmg: 135, hit: new Set(), singleTarget: opponent
      });
      screenShake = 15;
      for(let i=0;i<40;i++) spawnParticles(opponent.x, opponent.y-opponent.h/2, '#FF3333', 1, 5);
      for(let i=0;i<20;i++) spawnParticles(opponent.x, opponent.y-opponent.h/2, '#FFAA00', 1, 4);
    }
  }

  correctorSkill(idx, opponent){
    if(idx === 0){
      if(this.bq < 45){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 45;
      const heal = Math.floor(this.maxHp / 5);
      this.hp = Math.min(this.maxHp, this.hp + heal);
      floatTexts.push({x:this.x,y:this.y-this.h-10,text:'+'+heal,color:'#44CCFF',life:60,vy:-1.5});
      for(let i=0;i<20;i++){
        particles.push({
          x: this.x + random(-20,20), y: this.y,
          vx: random(-1,1), vy: random(-4,-2),
          life: 40, maxLife: 40, color: '#1369A5', r: random(2,5)
        });
      }
      shockwaves.push({x:this.x, y:this.y-this.h/2, r:5, maxR:80, color:'#1369A5', life:30, owner:this, dmg:0, hit:new Set()});
    } else if(idx === 1){
      if(this.bq < 60){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      const dist = abs(opponent.x - this.x);
      if(dist > 350){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'太远了',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 60;
      projectiles.push({
        x: this.x + this.facing*20, y: this.y - this.h/2,
        vx: this.facing * 8, vy: 0,
        dmg: 50, color: '#1369A5', owner: this, type: 'stun', life: 80, r: 14, trail: [], stunDur: 300
      });
      for(let i=0;i<10;i++) spawnParticles(this.x+this.facing*20, this.y-this.h/2, '#1369A5', 1, 2);
    } else if(idx === 2){
      if(this.bq < 55){ floatTexts.push({x:this.x,y:this.y-this.h-10,text:'犇气不足',color:'#FF0',life:40,vy:-1.5}); return; }
      this.bq -= 55;
      this.teleportInvuln = 180;
      const dir = this.x < opponent.x ? -1 : 1;
      const targetX = this.x + dir * 200;
      for(let i=0;i<15;i++) spawnParticles(this.x, this.y-this.h/2, this.color, 1, 3);
      this.x = constrain(targetX, 50, width-50);
      this.y = this.y - 20;
      this.vy = -5;
      for(let i=0;i<25;i++) spawnParticles(this.x, this.y-this.h/2, this.color, 1, 4);
      floatTexts.push({x:this.x,y:this.y-this.h-10,text:'逃脱!',color:this.color,life:50,vy:-1.5});
      screenShake = 6;
    }
  }

  draw(){
    push();
    const cx = this.x, cy = this.y;
    // 闪避无敌时轻微闪烁（降低频率，避免刺眼）
    if(this.teleportInvuln > 0 && frameCount % 10 < 3){ pop(); return; }

    // 脚下阴影
    fill(0, 0, 0, 100); noStroke();
    ellipse(cx, cy+2, 34, 9);

    // ===== 队伍光晕（P1红 / P2蓝）=====
    const glowR = this.teamGlow[0], glowG = this.teamGlow[1], glowB = this.teamGlow[2];
    const pulse = 0.6 + 0.4 * sin(frameCount * 0.08 + (this.isP1 ? 0 : PI));
    noFill();
    // 外层大光晕
    strokeWeight(1);
    stroke(glowR, glowG, glowB, 35 * pulse);
    circle(cx, cy - this.h/2, this.h * 1.6);
    // 中层光晕
    strokeWeight(2);
    stroke(glowR, glowG, glowB, 65 * pulse);
    circle(cx, cy - this.h/2, this.h * 1.25);
    // 内层紧贴光晕
    strokeWeight(3);
    stroke(glowR, glowG, glowB, 100 * pulse);
    circle(cx, cy - this.h/2, this.h * 0.95);

    // 技能状态圆环（放在光晕之后、身体之前）
    if(this.immortal){
      noFill(); strokeWeight(3);
      stroke(80,220,240,110+sin(frameCount*0.1)*30);
      circle(cx, cy - this.h/2, 86);
    }
    if(this.teleportInvuln > 0){
      noFill(); strokeWeight(2);
      stroke(red(this.color),green(this.color),blue(this.color),110);
      circle(cx, cy - this.h/2, 80);
    }
    if(this.chargingRP){
      noFill(); strokeWeight(2);
      stroke(90,130,255,110+sin(frameCount*0.1)*30);
      circle(cx, cy - this.h/2, 70);
    }
    if(this.slowed > 0){
      noFill(); strokeWeight(2);
      stroke(95,159,214,100);
      circle(cx, cy - this.h/2, 76);
    }

    // ===== 绘制正常比例小人（头:躯干:腿 ≈ 1:1.1:1.4，标准人体比例）=====
    const col = this.hurtFlash > 0 ? lerpColor(color(this.color), color(255), 0.55) : color(this.color);
    const headR = 11;                          // 头半径
    const headY = cy - this.h + headR;         // 头中心（靠顶部）
    const neckY = headY + headR;               // 脖子底部
    const shoulderY = neckY + 3;               // 肩膀Y（手臂起点）
    const shoulderW = 8;                       // 肩宽（每侧距中线）
    const hipY = cy - 28;                      // 胯部Y（比之前高，留出长腿）
    const torsoBot = hipY;                     // 躯干底端 = 胯部
    const kneeY = (hipY + cy) / 2;             // 膝盖 = 胯到脚的中点（关键：腿才长）
    const walkSwing = sin(this.walkCycle) * 0.55;
    const attackSwing = this.attackAnim > 0 ? sin((1-this.attackAnim/15)*PI) * 1.3 : 0;

    stroke(col);
    strokeCap(ROUND);

    // === 腿（占比最大，膝盖在中间）===
    strokeWeight(5.5);
    const legSwing = this.onGround ? walkSwing : (this.vy < 0 ? -0.4 : 0.4);
    const hipOffX = 6;  // 胯部左右分开一点
    // 后腿
    {
      const hx = cx - hipOffX;
      const kx = hx + sin(-legSwing)*7;
      const fx = kx + sin(-legSwing)*12;
      line(hx, hipY, kx, kneeY);
      line(kx, kneeY, fx, cy);
    }
    // 前腿
    {
      const hx = cx + hipOffX;
      const kx = hx + sin(legSwing)*7;
      const fx = kx + sin(legSwing)*12;
      line(hx, hipY, kx, kneeY);
      line(kx, kneeY, fx, cy);
    }

    // === 躯干（从肩到胯，居中）===
    strokeWeight(7);
    line(cx, shoulderY, cx, torsoBot);

    // === 手臂（起点在肩膀两侧 cx±shoulderW，不再接在肚子上）===
    strokeWeight(4.5);
    const armSwing = this.onGround ? -walkSwing : 0.25;

    // 后手臂（上臂+前臂，自然下垂带小幅摆动）
    {
      const sx = cx - this.facing * shoulderW;
      const backArmSwing = -armSwing;
      const ex = sx + cos(backArmSwing + PI/2 + 0.2)*9;
      const ey = shoulderY + 14;
      const hx = ex + cos(backArmSwing + PI/2 + 0.4)*11;
      const hy = ey + 10;
      line(sx, shoulderY, ex, ey);
      line(ex, ey, hx, hy);
      noStroke(); fill(col);
      circle(hx, hy, 6);
      stroke(col);
    }

    // 前手臂（攻击时出拳）
    {
      const sx = cx + this.facing * shoulderW;
      const baseAngle = this.facing > 0 ? 0.15 : PI - 0.15;
      const punchAngle = this.facing > 0 ? -attackSwing*0.9 : PI + attackSwing*0.9;
      const finalAngle = this.attackAnim > 0 ? punchAngle : baseAngle;
      const upperLen = 13;
      const foreLen = 14 + (this.attackAnim > 0 ? 14 : 0);
      const ex = sx + cos(finalAngle*0.6) * upperLen;
      const ey = shoulderY + sin(finalAngle*0.6) * upperLen + 3;
      const hx = ex + cos(finalAngle) * foreLen;
      const hy = ey + sin(finalAngle) * foreLen;
      line(sx, shoulderY, ex, ey);
      line(ex, ey, hx, hy);
      // 拳头
      noStroke(); fill(col);
      circle(hx, hy, this.attackAnim > 0 ? 12 : 7);
    }

    // === 头部 ===
    noStroke();
    // 脖子
    stroke(col); strokeWeight(5);
    line(cx, shoulderY, cx, neckY);
    // 头
    noStroke(); fill(col);
    circle(cx, headY, headR*2);
    // 眼睛（面向方向）
    fill(0);
    circle(cx + this.facing*4, headY-1, 3);
    // 眼睛高光
    fill(255);
    circle(cx + this.facing*4.5, headY-2, 1);

    // 做题时显示📖
    if(this.immortal){
      fill(255);
      textSize(18); textAlign(CENTER);
      text('📖', cx, headY - headR - 12 + sin(frameCount*0.12)*3);
    }

    // 眩晕星星
    if(this.stunned > 0){
      fill(255,200,0);
      textSize(16); textAlign(CENTER);
      text('💫', cx, headY - headR - 12 + sin(frameCount*0.15)*3);
    }

    pop();
  }
}

// ==================== 粒子/特效 ====================
function spawnParticles(x, y, col, count, speed){
  if(particles.length > 220) return;               // 粒子上限，防止大招时满屏
  for(let i=0;i<count;i++){
    if(Math.random() < 0.45) continue;              // 整体粒子量减半，降低视觉噪音
    particles.push({
      x, y,
      vx: random(-speed, speed), vy: random(-speed, speed*0.5),
      life: random(20, 40), maxLife: 40,
      color: col, r: random(2, 5)
    });
  }
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.08; p.vx *= 0.97;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

function drawParticles(){
  noStroke();
  for(let p of particles){
    let c = color(p.color);
    c.setAlpha(170 * (p.life/p.maxLife));
    fill(c);
    circle(p.x, p.y, p.r * (p.life/p.maxLife + 0.3) * 0.85);
  }
}

function updateShockwaves(){
  for(let i=shockwaves.length-1;i>=0;i--){
    let s = shockwaves[i];
    s.r += (s.maxR - s.r) * 0.12;
    s.life--;
    if(s.dmg > 0){
      let targets = s.singleTarget ? [s.singleTarget] : [p1,p2];
      for(let t of targets){
        if(t === s.owner || s.hit.has(t) || t.hp<=0) continue;
        const d = dist(s.x, s.y, t.x, t.y - t.h/2);
        if(d < s.r + 20 && d > s.r - 30){
          t.takeDamage(s.dmg, s.x, s.y, s.color);
          s.hit.add(t);
        }
      }
    }
    if(s.life<=0) shockwaves.splice(i,1);
  }
}

function drawShockwaves(){
  noFill();
  for(let s of shockwaves){
    let c = color(s.color);
    c.setAlpha(150 * (s.life/40));
    strokeWeight(2.5); stroke(c);
    circle(s.x, s.y, s.r*2);
    c.setAlpha(50*(s.life/40));
    strokeWeight(1.5); stroke(c);
    circle(s.x, s.y, s.r*2*0.7);
  }
}

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    let p = projectiles[i];
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length > 8) p.trail.shift();
    p.x += p.vx; p.y += p.vy;
    p.life--;
    let hit = false;
    for(let t of [p1,p2]){
      if(t === p.owner || t.hp<=0) continue;
      if(dist(p.x,p.y,t.x,t.y-t.h/2) < p.r + 15){
        if(p.type === 'stun'){
          t.takeDamage(p.dmg, p.x, p.y, p.color);
          t.stunned = p.stunDur;
          floatTexts.push({x:t.x,y:t.y-t.h-20,text:'眩晕!',color:p.color,life:60,vy:-1.5});
          for(let j=0;j<20;j++) spawnParticles(t.x,t.y-t.h/2,p.color,1,3);
        } else if(p.type === 'copy'){
          t.takeDamage(p.owner.atk/3, p.x, p.y, p.color);
          const oppSk = CHARACTERS[t.charId].skills;
          if(oppSk.length>0 && !p.owner.copiedSkill){
            p.owner.copiedSkill = oppSk[0];
            floatTexts.push({x:p.owner.x,y:p.owner.y-p.owner.h-20,text:'复刻成功',color:p.color,life:50,vy:-1.5});
          }
        } else {
          t.takeDamage(p.dmg, p.x, p.y, p.color);
        }
        for(let j=0;j<12;j++) spawnParticles(p.x,p.y,p.color,1,3);
        screenShake = Math.max(screenShake, 4);
        hit = true; break;
      }
    }
    for(let plat of platforms){
      if(p.x>plat.x && p.x<plat.x+plat.w && p.y>plat.y-5 && p.y<plat.y+plat.h+5){
        hit = true;
        for(let j=0;j<8;j++) spawnParticles(p.x,p.y,p.color,1,2);
        break;
      }
    }
    if(hit || p.life<=0 || p.x<-50 || p.x>width+50 || p.y>height+50) projectiles.splice(i,1);
  }
}

function drawProjectiles(){
  for(let p of projectiles){
    noFill();
    for(let j=0;j<p.trail.length;j++){
      let t = p.trail[j];
      let c = color(p.color);
      c.setAlpha(90 * j/p.trail.length);
      stroke(c); strokeWeight(p.r * j/p.trail.length * 0.8);
      point(t.x,t.y);
    }
    noStroke();
    let c = color(p.color);
    fill(255,255,255,220); circle(p.x,p.y,p.r*0.6);
    c.setAlpha(200); fill(c); circle(p.x,p.y,p.r);
    c.setAlpha(35); fill(c); circle(p.x,p.y,p.r*1.5);
  }
}

function updateFloatTexts(){
  for(let i=floatTexts.length-1;i>=0;i--){
    let t = floatTexts[i];
    t.y += t.vy; t.vy *= 0.96; t.life--;
    if(t.life<=0) floatTexts.splice(i,1);
  }
}

function drawFloatTexts(){
  textAlign(CENTER); textStyle(BOLD);
  for(let t of floatTexts){
    let c = color(t.color);
    c.setAlpha(255 * min(1,t.life/20));
    fill(c); noStroke();
    textSize(t.text.length>4?16:20);
    text(t.text, t.x, t.y);
  }
}

function drawSlashEffects(advance = true){
  for(let i=slashEffects.length-1;i>=0;i--){
    let s = slashEffects[i];
    if(advance) s.life--;
    let prog = 1 - s.life/s.maxLife;
    push();
    translate(s.x, s.y);
    rotate(s.angle);
    noFill();
    let c = color(s.color);
    c.setAlpha(190*(1-prog));
    stroke(c); strokeWeight(3*(1-prog)+1);
    arc(0, 0, s.range*2, s.range*1.2, -0.6+prog*1.2, 0.6-prog*1.2);
    c.setAlpha(60*(1-prog));
    strokeWeight(1.5); stroke(c);
    arc(0, 0, s.range*2*0.7, s.range*0.8, -0.5+prog*1, 0.5-prog*1);
    pop();
    if(s.life<=0) slashEffects.splice(i,1);
  }
}

// ==================== 平台与背景 ====================
function setupPlatforms(){
  platforms = [];
  const GY = height - 60;
  const W = width;
  platforms.push({x:0,y:GY,w:W,h:60,isGround:true});
  platforms.push({x:100,y:GY-70,w:110,h:16});
  platforms.push({x:W-210,y:GY-70,w:110,h:16});
  platforms.push({x:60,y:GY-160,w:130,h:16});
  platforms.push({x:W-190,y:GY-160,w:130,h:16});
  platforms.push({x:W/2-130,y:GY-240,w:260,h:16});
  platforms.push({x:250,y:GY-230,w:100,h:16});
  platforms.push({x:W-350,y:GY-230,w:100,h:16});
  platforms.push({x:W/2-50,y:GY-330,w:100,h:16});
}

let bgLayer = null;
function setupBackground(){
  // 静态背景只在开局/改窗口大小时画一次，存进离屏图层；
  // 每帧整张贴图，彻底避免逐线渐变留缝导致的残影
  if(bgLayer) bgLayer.remove();
  bgLayer = createGraphics(width, height);
  const g = bgLayer;
  g.pixelDensity(pixelDensity());
  const GY = height - 60;

  // 竖向渐变（用 Canvas 原生渐变，一次填满，无缝隙）
  const ctx = g.drawingContext;
  const grad = ctx.createLinearGradient(0,0,0,height);
  grad.addColorStop(0, '#0b0a1f');
  grad.addColorStop(1, '#06070f');
  ctx.fillStyle = grad; ctx.fillRect(0,0,width,height);

  // 柔和的环境光（很淡）
  g.noStroke();
  const glow = (x,y,r,c)=>{
    const rg = ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,c); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(x-r,y-r,r*2,r*2);
  };
  glow(width*0.22, height*0.32, 320, 'rgba(120,60,200,0.07)');
  glow(width*0.78, height*0.55, 380, 'rgba(50,80,200,0.06)');

  // 星星
  for(let i=0;i<45;i++){
    g.fill(255,255,255,random(40,120));
    g.circle(random(width), random(height*0.45), random(0.6,1.4));
  }

  // 远景楼群（暗、低饱和，窗户少而暗）
  for(let i=0;i<Math.ceil(width/70)+4;i++){
    const bw = random(40,90), bh = random(110,320);
    const x = i*70 + random(-20,20) - 120;
    g.fill(random(14,22), random(12,20), random(28,40));
    g.rect(x, GY-bh, bw, bh);
    const cols = Math.floor(bw/14), rows = Math.floor(bh/20);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(Math.random()<0.22){
        Math.random()<0.5 ? g.fill(200,90,150,55) : g.fill(90,170,220,55);
        g.rect(x+c*14+4, GY-bh+r*20+4, 6, 8);
      }
    }
  }
  // 地面前的雾，压暗楼群底部
  const fog = ctx.createLinearGradient(0,GY-140,0,GY);
  fog.addColorStop(0,'rgba(6,7,15,0)'); fog.addColorStop(1,'rgba(6,7,15,0.85)');
  ctx.fillStyle = fog; ctx.fillRect(0,GY-140,width,140);

  // 透视网格（低透明度）
  g.stroke(0,180,255,14); g.strokeWeight(1);
  for(let i=0;i<9;i++){ const y = GY - i*30; g.line(0,y,width,y); }
  for(let i=-10;i<=10;i++) g.line(width/2+i*80, GY, width/2+i*350, GY-200);
}

function drawBackground(){
  if(!bgLayer || bgLayer.width !== width || bgLayer.height !== height) setupBackground();
  image(bgLayer, 0, 0, width, height);
}

function drawPlatforms(){
  for(let p of platforms){
    if(p.isGround){
      noStroke(); fill(12,12,24); rect(p.x,p.y,p.w,p.h);
      strokeWeight(2); stroke(190,70,160,120);
      line(p.x,p.y,p.x+p.w,p.y);
      stroke(255,255,255,8); strokeWeight(1);
      for(let x=0;x<p.w;x+=40) line(p.x+x,p.y+2,p.x+x,p.y+p.h);
    } else {
      noStroke();
      fill(24,24,44); rect(p.x,p.y,p.w,p.h,4);
      fill(10,10,22,200); rect(p.x+2,p.y+p.h,p.w-4,3,2);
      strokeWeight(2); stroke(80,200,230,140);
      line(p.x+3,p.y+1,p.x+p.w-3,p.y+1);
    }
  }
  noStroke();
}

// ==================== UI绘制 ====================
function drawUI(){
  const bw = min(340, width*0.36);
  drawHealthBar(20, 18, bw, p1, true);
  drawHealthBar(width-20-bw, 18, bw, p2, false);
  // 中间 VS 徽章 + 对局计时
  push();
  textAlign(CENTER,CENTER); textStyle(BOLD); noStroke();
  fill(10,10,30,200); rectMode(CENTER); rect(width/2, 44, 64, 44, 12);
  stroke(255,255,255,40); noFill(); rect(width/2, 44, 64, 44, 12); noStroke();
  fill(255); textSize(20); text(Math.floor(matchFrames/60), width/2, 40);
  fill(255,255,255,110); textSize(9); textStyle(NORMAL); text('SEC', width/2, 58);
  pop();
}

function drawHealthBar(x, y, w, player, isLeft){
  const h = 62;
  push();
  // 面板
  noStroke(); fill(8,8,24,190); rect(x,y,w,h,12);
  const tc = player.teamColor || player.color;
  noFill(); strokeWeight(1); stroke(red(color(tc)),green(color(tc)),blue(color(tc)),110); rect(x,y,w,h,12);

  // 名字 + 头像
  noStroke(); textStyle(BOLD); textSize(14);
  const emoji = CHARACTERS[player.charId].emoji;
  fill(255);
  textAlign(isLeft?LEFT:RIGHT, CENTER);
  text(emoji + ' ' + player.name + (isLeft?'  P1':''), isLeft?x+12:x+w-12, y+14);
  if(!isLeft){ textAlign(LEFT,CENTER); fill(tc); text('P2', x+12, y+14); }

  // 血条：残影（延迟掉血）
  const bx = x+10, bwid = w-20, by = y+26, bh = 13;
  if(player.ghostHp === undefined) player.ghostHp = player.hp;
  if(player.ghostHp > player.hp){ player.ghostHp = max(player.hp, player.ghostHp - player.maxHp*0.004); }
  else player.ghostHp = player.hp;
  const hpR = player.hp/player.maxHp, ghR = player.ghostHp/player.maxHp;
  fill(40,10,20); rect(bx,by,bwid,bh,6);
  fill(255,230,230,200);
  if(isLeft) rect(bx,by,bwid*ghR,bh,6); else rect(bx+bwid*(1-ghR),by,bwid*ghR,bh,6);
  const g = drawingContext.createLinearGradient(bx,0,bx+bwid,0);
  const low = hpR < 0.3;
  const c1 = low ? '#FF2E4D' : tc, c2 = low ? '#FF8A3D' : '#FFFFFF';
  if(isLeft){ g.addColorStop(0,c1); g.addColorStop(1,c2); } else { g.addColorStop(0,c2); g.addColorStop(1,c1); }
  drawingContext.fillStyle = g;
  if(isLeft) rect(bx,by,bwid*hpR,bh,6); else rect(bx+bwid*(1-hpR),by,bwid*hpR,bh,6);
  drawingContext.globalAlpha = 1;
  fill(255); textStyle(BOLD); textSize(10); textAlign(CENTER,CENTER);
  text(Math.ceil(player.hp)+' / '+player.maxHp, bx+bwid/2, by+bh/2+1);

  // 犇气条 + 技能消耗刻度
  const qy = by+bh+6, qh = 7;
  fill(25,25,55); rect(bx,qy,bwid,qh,4);
  const qR = player.bq/player.maxBq;
  fill(255,200,40);
  if(isLeft) rect(bx,qy,bwid*qR,qh,4); else rect(bx+bwid*(1-qR),qy,bwid*qR,qh,4);
  stroke(255,255,255,140); strokeWeight(1);
  for(const sk of CHARACTERS[player.charId].skills){
    if(sk.cost<=0 || sk.cost>=player.maxBq) continue;
    const r = sk.cost/player.maxBq;
    const tx = isLeft ? bx+bwid*r : bx+bwid*(1-r);
    line(tx, qy-2, tx, qy+qh+2);
  }
  noStroke(); fill(255,210,60); textSize(9); textStyle(BOLD);
  textAlign(isLeft?RIGHT:LEFT, CENTER);
  text('⚡'+Math.floor(player.bq), isLeft?x+w-12:x+12, y+14);

  // 状态图标
  const icons = [];
  if(player.chargingRP) icons.push('📝');
  if(player.immortal) icons.push('🛡');
  if(player.slowed>0) icons.push('🐌');
  if(player.stunned>0) icons.push('💫');
  if(player.teleportInvuln>0) icons.push('✨');
  textSize(14); textAlign(isLeft?LEFT:RIGHT, TOP);
  icons.forEach((ic,i)=> text(ic, isLeft ? x+4+i*22 : x+w-4-i*22, y+h+6));
  pop();
}

// ==================== 技能按钮UI ====================
function buildSkillBars(){
  const p1s = document.getElementById('p1Skills');
  const p2s = document.getElementById('p2Skills');
  p1s.innerHTML = ''; p2s.innerHTML = '';
  const p1Atk = document.createElement('div');
  p1Atk.className='sk-btn attack'; p1Atk.id='btn-p1-atk';
  p1Atk.innerHTML='<span class="k">F</span><span class="n">普攻</span>';
  p1s.appendChild(p1Atk);
  const p1Sk = CHARACTERS[p1Char].skills;
  p1Sk.forEach((s,i)=>{
    const b = document.createElement('div');
    b.className = 'sk-btn'; b.id = `btn-p1-s${i}`;
    b.innerHTML = `<span class="k">${P1_SKILL_KEYS[i]}</span><span class="n">${s.name}</span>${s.cost>0?`<span class="c">⚡${s.cost}</span>`:''}`;
    p1s.appendChild(b);
  });
  const p2Atk = document.createElement('div');
  p2Atk.className='sk-btn attack'; p2Atk.id='btn-p2-atk';
  p2Atk.innerHTML='<span class="k">L</span><span class="n">普攻</span>';
  p2s.appendChild(p2Atk);
  const p2Sk = CHARACTERS[p2Char].skills;
  p2Sk.forEach((s,i)=>{
    const b = document.createElement('div');
    b.className = 'sk-btn'; b.id = `btn-p2-s${i}`;
    b.innerHTML = `<span class="k">${P2_SKILL_KEYS[i]}</span><span class="n">${s.name}</span>${s.cost>0?`<span class="c">⚡${s.cost}</span>`:''}`;
    p2s.appendChild(b);
  });
  bindSkillButtons();
}

function bindSkillButtons(){
  const addBtn = (id, keyCode) => {
    const el = document.getElementById(id);
    if(!el) return;
    const down = (e)=>{ e.preventDefault(); el.classList.add('pressed'); keys[keyCode]=true; keyPressedOnce[keyCode]=true; };
    const up = (e)=>{ e.preventDefault(); el.classList.remove('pressed'); keys[keyCode]=false; };
    el.addEventListener('touchstart', down, {passive:false});
    el.addEventListener('touchend', up, {passive:false});
    el.addEventListener('touchcancel', up, {passive:false});
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  };
  addBtn('btn-p1-atk', 70);
  addBtn('btn-p2-atk', 76);
  P1_SKILL_CODES.forEach((kc,i)=>addBtn(`btn-p1-s${i}`, kc));
  [85,73,79,75].forEach((kc,i)=>addBtn(`btn-p2-s${i}`, kc));
}

function highlightBtn(keyCode, pressed){
  const map = {
    70:'btn-p1-atk', 81:'btn-p1-s0', 69:'btn-p1-s1', 82:'btn-p1-s2', 84:'btn-p1-s3',
    76:'btn-p2-atk', 85:'btn-p2-s0', 73:'btn-p2-s1', 79:'btn-p2-s2', 75:'btn-p2-s3'
  };
  const id = map[keyCode];
  if(id){
    const el = document.getElementById(id);
    if(el) el.classList.toggle('pressed', pressed);
  }
}

// ==================== 移动端控制 ====================
const mInput = { p1:{left:false,right:false,jump:false}, p2:{left:false,right:false,jump:false} };

function setupMobileControls(){
  if(!isMobile || mobileReady) return;
  mobileReady = true;
  document.getElementById('mobileControls').style.display = 'block';

  // 左右摇杆：左控 P1（红方），右控 P2（蓝方）
  const bindJoy = (areaId, stickId, mi) => {
    const area = document.getElementById(areaId);
    const stick = document.getElementById(stickId);
    if(!area || !stick) return;
    let activeId = null, sx = 0, sy = 0;
    const R = 36;
    area.addEventListener('touchstart', e=>{
      e.preventDefault();
      const t = e.changedTouches[0];
      activeId = t.identifier;
      const r = area.getBoundingClientRect();
      sx = r.left + r.width/2; sy = r.top + r.height/2;
    }, {passive:false});
    area.addEventListener('touchmove', e=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        if(t.identifier !== activeId) continue;
        let dx = t.clientX - sx, dy = t.clientY - sy;
        const d = Math.hypot(dx, dy);
        if(d > R){ dx *= R/d; dy *= R/d; }
        stick.style.transform = `translate(${dx}px,${dy}px)`;
        mi.left = dx < -14; mi.right = dx > 14;
        if(dy < -20) mi.jump = true;
      }
    }, {passive:false});
    const end = e=>{
      for(const t of e.changedTouches){
        if(t.identifier === activeId){
          activeId = null; stick.style.transform = '';
          mi.left = mi.right = false;
        }
      }
    };
    area.addEventListener('touchend', end);
    area.addEventListener('touchcancel', end);
  };
  bindJoy('joyLeft', 'stickL', mInput.p1);
  bindJoy('joyRight', 'stickR', mInput.p2);

  // 跳跃键
  const bindJump = (id, mi) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', e=>{ e.preventDefault(); mi.jump = true; }, {passive:false});
  };
  bindJump('mJumpL', mInput.p1);
  bindJump('mJumpR', mInput.p2);

  // 双方「普攻 + 技能」按键（与键盘、底部技能栏等效）
  const buildSkills = (contId, cls, atkCode, skillCodes, keyLabels, charId) => {
    const cont = document.getElementById(contId);
    if(!cont) return;
    cont.innerHTML = '';
    const tap = kc => ()=>{ keys[kc]=true; keyPressedOnce[kc]=true; setTimeout(()=>{ keys[kc]=false; }, 80); };
    const add = (label, onDown) => {
      const b = document.createElement('div');
      b.className = 'm-sk-btn ' + cls;
      b.textContent = label;
      b.addEventListener('touchstart', e=>{ e.preventDefault(); b.classList.add('active'); onDown(); }, {passive:false});
      b.addEventListener('touchend', e=>{ e.preventDefault(); b.classList.remove('active'); }, {passive:false});
      b.addEventListener('touchcancel', e=>{ e.preventDefault(); b.classList.remove('active'); }, {passive:false});
      cont.appendChild(b);
    };
    add('攻', tap(atkCode));
    const sk = CHARACTERS[charId].skills;
    skillCodes.forEach((kc, i)=>{ if(i < sk.length) add(keyLabels[i], tap(kc)); });
  };
  buildSkills('mSkillsP1', 'p1', 70, P1_SKILL_CODES, P1_SKILL_KEYS, p1Char);
  buildSkills('mSkillsP2', 'p2', 76, [85,73,79,75], P2_SKILL_KEYS, p2Char);
}
// ==================== 游戏主流程 ====================
function startGame(){
  if(!p1Char || !p2Char){
    console.warn('角色未选全');
    return;
  }
  try {
    document.getElementById('selectScreen').style.display = 'none';
    gameState = 'playing';
    checkMobile();
    setupPlatforms();
    setupBackground();
    buildSkillBars();
    if(isMobile){
      // 手机端：隐藏底部技能栏，改用贴身虚拟按键 + 左右摇杆
      document.getElementById('skillBar').style.display = 'none';
      document.getElementById('mobileControls').style.display = 'block';
      setupMobileControls();
    } else {
      document.getElementById('skillBar').style.display = 'block';
      document.getElementById('mobileControls').style.display = 'none';
    }

    var GY = height - 60;
    p1 = new Fighter(width * 0.25, GY, p1Char, true);
    p2 = new Fighter(width * 0.75, GY, p2Char, false);

    projectiles = [];
    particles = [];
    shockwaves = [];
    floatTexts = [];
    slashEffects = [];
    screenShake = 0;
    hitStop = 0; koTimer = 0; matchFrames = 0; paused = false;
    countdown = 200; banner = 0;
    keys = {}; keyPressedOnce = {};
    p1.dmgDealt = 0; p2.dmgDealt = 0; p1.ghostHp = p1.hp; p2.ghostHp = p2.hp;

    loop();
  } catch(e) {
    console.error('startGame 出错:', e);
    alert('启动游戏失败: ' + e.message);
  }
}

function setup(){
  let cv = createCanvas(windowWidth, windowHeight);
  cv.parent(document.body);
  cv.style('position','fixed');
  cv.style('top','0'); cv.style('left','0');
  cv.style('z-index','1');
  noSmooth();
  frameRate(60);
  initSelectScreen();
  noLoop();
}

function draw(){
  if(gameState !== 'playing'){
    background(8,8,22);
    noLoop();
    return;
  }

  // ---------- 逻辑更新：暂停 / 受击停顿 / 倒计时期间冻结 ----------
  let freeze = paused;
  if(!freeze && hitStop > 0 && koTimer === 0){ hitStop--; freeze = true; }

  if(!freeze){
    matchFrames++;
    if(countdown <= 0){
      p1.update(p2);
      p2.update(p1);

      if(keys[P1_KEYS.atk]) { p1.attack(p2); keys[P1_KEYS.atk]=false; highlightBtn(70,false); }
      if(keys[P2_KEYS.atk]) { p2.attack(p1); keys[P2_KEYS.atk]=false; highlightBtn(76,false); }

      if(koTimer === 0){
        const checkSkill = (player, keyList, opp) => {
          keyList.forEach((kc,i)=>{
            if(keyPressedOnce[kc]){
              if(i < CHARACTERS[player.charId].skills.length) player.useSkill(i, opp);
              keyPressedOnce[kc] = false;
              highlightBtn(kc,false);
            }
          });
        };
        checkSkill(p1, P1_SKILL_CODES, p2);
        checkSkill(p2, P2_SKILL_CODES, p1);
      }
    } else {
      matchFrames--; // 倒计时不计入对局时长
      keys[P1_KEYS.atk] = keys[P2_KEYS.atk] = false;
    }
    updateProjectiles();
    updateShockwaves();
    updateParticles();
    updateFloatTexts();
  }

  // ---------- 渲染：每一帧都整屏重画，杜绝残影/烧屏 ----------
  resetCtx();
  background(6,7,15);                       // 先整屏清空（包括震屏露出的边缘）
  push();
  if(screenShake > 0 && !paused){
    const sh = min(screenShake, 8) * 0.5;   // 震屏减半并封顶
    translate(random(-sh,sh), random(-sh,sh));
    if(!freeze){ screenShake *= 0.82; if(screenShake < 0.5) screenShake = 0; }
  }
  drawBackground();
  drawPlatforms();
  drawShockwaves();
  drawProjectiles();
  drawSlashEffects(!freeze);
  p1.draw();
  p2.draw();
  drawParticles();
  drawFloatTexts();
  pop();
  resetCtx();

  drawUI();
  if(frameCount % 6 === 0) updateSkillButtons();

  if(!freeze) for(let k in keyPressedOnce) keyPressedOnce[k] = false;

  if(countdown > 0){ drawCountdown(); if(!paused) countdown--; }

  if(!paused && koTimer === 0 && (p1.hp <= 0 || p2.hp <= 0)){
    koTimer = 70; screenShake = 7;
    frameRate(30); // KO 慢动作
  }
  if(koTimer > 0){
    drawKO();
    if(!paused) koTimer--;
    if(koTimer === 0){
      frameRate(60);
      gameState = 'win';
      noLoop();
      showWin();
    }
  }

  if(paused) drawPauseOverlay();
}

// 清掉可能残留的画布状态（阴影/透明度），防止发光“漏”到别的元素上
function resetCtx(){
  const c = drawingContext;
  c.shadowBlur = 0; c.shadowColor = 'rgba(0,0,0,0)'; c.globalAlpha = 1;
}

function drawCountdown(){
  const t = countdown;
  const label = t > 150 ? '3' : t > 100 ? '2' : t > 50 ? '1' : 'FIGHT!';
  const prog = (t % 50) / 50;               // 1 → 0
  push();
  noStroke(); fill(0,0,0, label==='FIGHT!' ? 70*prog : 70); rect(0,0,width,height);
  textAlign(CENTER, CENTER); textStyle(BOLD);
  textSize((label==='FIGHT!' ? 80 : 110) * (0.9 + prog*0.25));
  fill(0,0,0,120); text(label, width/2+3, height/2 - 27);   // 简单投影代替发光
  fill(label==='FIGHT!' ? color(255,120,150, 255*min(1,prog*2+0.2)) : color(240,240,255, 255*min(1,prog*2+0.2)));
  text(label, width/2, height/2 - 30);
  pop();
}

function drawKO(){
  push();
  const a = 1 - koTimer/70;
  noStroke(); fill(0,0,0,110*min(1,a*2)); rect(0,0,width,height);
  textAlign(CENTER, CENTER); textStyle(BOLD);
  textSize(120 * (1.3 - min(1,a*3)*0.3));
  fill(0,0,0,140); text('K.O.', width/2+4, height/2 - 26);
  fill(255,90,110); text('K.O.', width/2, height/2 - 30);
  pop();
}

function drawPauseOverlay(){
  push();
  noStroke(); fill(4,4,12,170); rect(0,0,width,height);   // 每帧重画整屏后只叠一次，不会越叠越黑
  rectMode(CENTER);
  fill(16,16,34); stroke(255,255,255,40); strokeWeight(1);
  rect(width/2, height/2, 320, 140, 16);
  noStroke(); fill(255); textAlign(CENTER,CENTER); textStyle(BOLD); textSize(32);
  text('暂 停', width/2, height/2 - 20);
  textStyle(NORMAL); textSize(14); fill(255,255,255,140);
  text('按 Esc / P 继续', width/2, height/2 + 28);
  pop();
}

function updateSkillButtons(){
  if(frameCount % 6) return;
  [[p1,'p1'],[p2,'p2']].forEach(([pl,tag])=>{
    CHARACTERS[pl.charId].skills.forEach((sk,i)=>{
      const el = document.getElementById(`btn-${tag}-s${i}`);
      if(!el) return;
      el.classList.toggle('nobq', sk.cost > 0 && pl.bq < sk.cost);
      const on = (pl.charId==='rpmaniac' && ((i===0 && pl.chargingRP) || (i===2 && pl.immortal)));
      el.classList.toggle('on', on);
    });
  });
}

function showWin(){
  const ws = document.getElementById('winScreen');
  const wt = document.getElementById('winText');
  const sub = document.getElementById('winSub');
  const winner = p1.hp>0 ? p1 : p2;
  wt.textContent = winner.name + ' 获胜!';
  wt.style.color = winner.color;
  wt.style.textShadow = '0 4px 0 rgba(0,0,0,0.5)';
  sub.textContent = (winner===p1?'玩家1（红方）':'玩家2（蓝方）')+' KO!';
  const secs = Math.round(matchFrames/60);
  document.getElementById('winStats').innerHTML = `
    <div class="win-stat">${secs}s<small>对局时长</small></div>
    <div class="win-stat" style="color:${p1.teamColor}">${Math.round(p1.dmgDealt||0)}<small>P1 造成伤害</small></div>
    <div class="win-stat" style="color:${p2.teamColor}">${Math.round(p2.dmgDealt||0)}<small>P2 造成伤害</small></div>
    <div class="win-stat">${Math.ceil(winner.hp)}<small>剩余血量</small></div>`;
  ws.style.display = 'flex';
}

function keyPressed(){
  if(gameState === 'select' && keyCode === ENTER && p1Char && p2Char){ startGame(); return false; }
  if(gameState === 'win' && keyCode === ENTER){ rematch(); return false; }
  if(gameState === 'playing' && (keyCode === ESCAPE || keyCode === 80) && koTimer === 0){
    paused = !paused; keys = {}; keyPressedOnce = {}; return false;
  }
  if(paused) return false;
  keys[keyCode] = true;
  keyPressedOnce[keyCode] = true;
  highlightBtn(keyCode, true);
  if([32,37,38,39,40,87,65,83,68].includes(keyCode)) return false;
}
function keyReleased(){
  keys[keyCode] = false;
  highlightBtn(keyCode, false);
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  if(gameState === 'playing'){
    setupPlatforms();
    setupBackground();
  }
}
</script>
